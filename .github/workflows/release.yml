name: Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  V8_VERSION: 8.3.20.1549
  LANG: ru_RU.UTF-8

jobs:
  draft_release:
    name: Draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Linux runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            locales
          sudo localedef -i ru_RU -c -f UTF-8 -A /usr/share/locale/locale.alias ru_RU.UTF-8

      - name: Install 1C:Enterprise
        uses: 1CDevFlow/onec-setup-action@e1cd5937cb951c3cdeda4bf482f89da5f5e0b148
        with:
          type: onec
          onec_version: ${{ env.V8_VERSION }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 15

      - name: Build client_mcp.cfe
        run: |
          set -euo pipefail
          mkdir -p dist
          mkdir -p server-data
          ibcmd infobase --data="$GITHUB_WORKSPACE/server-data" --db-path=file-db create
          ibcmd infobase --data="$GITHUB_WORKSPACE/server-data" --db-path=file-db config import --extension=client_mcp exts/client-mcp/src
          ibcmd infobase --data="$GITHUB_WORKSPACE/server-data" --db-path=file-db config save --extension=client_mcp dist/client_mcp.cfe
        timeout-minutes: 15

      - name: Upload client_mcp.cfe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client_mcp.cfe
          path: dist/client_mcp.cfe
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          files: dist/client_mcp.cfe
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: false
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
